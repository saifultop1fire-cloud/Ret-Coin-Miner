<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RET Coin Mining</title>
<!-- Telegram WebApp SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- TON Connect UI -->
<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
<!-- Font Awesome -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<style>
  :root {
    --bg: #0b0f19; --surface: #151b2b; --primary: #8b5cf6; 
    --success: #10b981; --danger: #ef4444; --text: #f8fafc; --text-muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
  
  .app-container { width: 100%; max-width: 400px; }
  
  /* Header */
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .logo-box { display: flex; align-items: center; gap: 10px; }
  .logo-box img { width: 40px; height: 40px; border-radius: 50%; }
  .logo-box h2 { font-size: 1.2rem; color: var(--primary); }
  .balance-box { background: var(--surface); padding: 8px 15px; border-radius: 20px; font-weight: bold; border: 1px solid rgba(255,255,255,0.1); }
  
  /* Mining Card */
  .mining-card { background: var(--surface); border-radius: 20px; padding: 25px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; overflow: hidden; margin-bottom: 20px; }
  .mining-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(139,92,246,0.15) 0%, transparent 60%); z-index: 0; }
  
  .coin-img { width: 120px; height: 120px; margin: 0 auto 15px; position: relative; z-index: 1; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  
  .level-badge { display: inline-block; background: rgba(139,92,246,0.2); color: var(--primary); padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; margin-bottom: 10px; z-index: 1; position: relative; }
  .mining-rate { font-size: 0.85rem; color: var(--success); margin-bottom: 15px; z-index: 1; position: relative; }
  .progress-bar-container { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; margin-bottom: 20px; overflow: hidden; position: relative; z-index: 1; }
  .progress-bar { height: 100%; background: linear-gradient(90deg, var(--primary), var(--success)); width: 0%; transition: width 0.3s ease; }
  .progress-text { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 20px; z-index: 1; position: relative; }
  
  .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 10px; z-index: 1; position: relative; }
  .btn-claim { background: var(--primary); color: white; }
  .btn-claim:active { transform: scale(0.95); }
  
  /* Wallet Section */
  .wallet-card { background: var(--surface); border-radius: 20px; padding: 20px; margin-bottom: 20px; }
  .wallet-title { font-size: 1rem; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
  .wallet-address { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; font-size: 0.8rem; word-break: break-all; margin-bottom: 15px; color: var(--text-muted); display: none; }
  .btn-withdraw { background: var(--success); color: white; margin-top: 15px; }
  
  .toast { position: fixed; top: -50px; left: 50%; transform: translateX(-50%); background: var(--success); color: white; padding: 10px 20px; border-radius: 30px; font-size: 0.9rem; transition: 0.3s; z-index: 1000; }
  .toast.show { top: 20px; }
  .toast.error { background: var(--danger); }
</style>
</head>
<body>

<div class="app-container">
  
  <!-- Header -->
  <div class="header">
    <div class="logo-box">
      <img src="https://i.ibb.co.com/B5qVQ0LN/RET-256x256.png" alt="Logo">
      <h2>RET Coin</h2>
    </div>
    <div class="balance-box" id="headerBalance">0.00 RET</div>
  </div>

  <!-- Mining Card -->
  <div class="mining-card">
    <img src="https://i.ibb.co.com/B5qVQ0LN/RET-256x256.png" class="coin-img" alt="Coin">
    <div class="level-badge">লেভেল: <span id="levelText">1</span></div>
    <div class="mining-rate"><i class="fas fa-bolt"></i> মাইনিং রেট: <span id="rateText">0.01</span> RET/ঘণ্টা</div>
    
    <div class="progress-bar-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-text">পরবর্তী লেভেলে যেতে আরও <span id="neededText">10.00</span> RET প্রয়োজন</div>
    
    <button class="btn btn-claim" id="claimBtn" onclick="claimCoins()">
      <i class="fas fa-gift"></i> ক্লেইম করুন
    </button>
  </div>

  <!-- Wallet Section -->
  <div class="wallet-card">
    <div class="wallet-title"><i class="fas fa-wallet"></i> TON ওয়ালেট</div>
    <div class="wallet-address" id="walletDisplay"></div>
    <div id="ton-connect-btn"></div>
    <button class="btn btn-withdraw" id="withdrawBtn" onclick="requestWithdraw()">উইথড্র রিকোয়েস্ট</button>
  </div>

</div>

<div class="toast" id="toast">Message</div>

<script>
  // ==========================================
  // ১. কনফিগারেশন
  // ==========================================
  const firebaseConfig = {
    apiKey: "AIzaSyBCAbDM0_mlRH1nvRXMzTLy19SITl-5ijg",
    authDomain: "ret-coin-mine.firebaseapp.com",
    databaseURL: "https://ret-coin-mine-default-rtdb.firebaseio.com",
    projectId: "ret-coin-mine",
    storageBucket: "ret-coin-mine.firebasestorage.app",
    messagingSenderId: "417445689965",
    appId: "1:417445689965:web:023edebe16193cc1e11d64"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // ⚠️ এখানে আপনার GitHub Pages এর tonconnect-manifest.json লিংকটি বসান
  const MANIFEST_URL = "https://YOUR_USERNAME.github.io/YOUR_REPO_NAME/tonconnect-manifest.json";

  // ==========================================
  // ২. গ্লোবাল ভ্যারিয়েবল
  // ==========================================
  const tg = window.Telegram.WebApp;
  tg.expand();
  
  let userId = null;
  let userName = "Unknown";
  let currentBalance = 0;
  let walletAddress = null;
  let tonConnectUI = null;
  
  // লেভেল এবং রেট ক্যালকুলেশন লজিক
  function getLevelData(balance) {
    if (balance < 10) return { level: 1, nextTarget: 10, rate: 0.01 };
    if (balance < 50) return { level: 2, nextTarget: 50, rate: 0.02 };
    if (balance < 200) return { level: 3, nextTarget: 200, rate: 0.05 };
    if (balance < 500) return { level: 4, nextTarget: 500, rate: 0.1 };
    
    const extraLevel = Math.floor((balance - 500) / 500);
    return { 
      level: 5 + extraLevel, 
      nextTarget: 500 + ((extraLevel + 1) * 500), 
      rate: 0.1 + (extraLevel * 0.1) 
    };
  }

  // ==========================================
  // ৩. ইনিশিয়ালাইজেশন
  // ==========================================
  window.onload = async function() {
    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
      userId = tg.initDataUnsafe.user.id.toString();
      userName = tg.initDataUnsafe.user.first_name;
      initFirebaseUser();
    } else {
      showToast("Please open from Telegram", true);
    }

    // TON Connect Initialize
    tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
      manifestUrl: MANIFEST_URL,
      buttonRootId: "ton-connect-btn" 
    });

    tonConnectUI.onStatusChange((wallet) => {
      if (wallet) {
        walletAddress = wallet.account.address;
        const display = document.getElementById('walletDisplay');
        display.style.display = 'block';
        display.innerText = "Connected: " + walletAddress.substring(0, 6) + '...' + walletAddress.substring(walletAddress.length - 4);
        db.ref('users/' + userId).update({ wallet: walletAddress });
      }
    });
  };

  // ==========================================
  // ৪. ফায়ারবেস ডাটা লোড
  // ==========================================
  function initFirebaseUser() {
    const userRef = db.ref('users/' + userId);
    
    userRef.on('value', (snapshot) => {
      if (!snapshot.exists()) {
        userRef.set({
          name: userName,
          balance: 0,
          banned: false,
          wallet: "",
          lastClaim: Date.now()
        }).then(() => updateUI(0));
      } else {
        const data = snapshot.val();
        if (data.banned) {
          document.body.innerHTML = "<h2 style='text-align:center;margin-top:50px;color:red;'>আপনি ব্যান হয়েছেন!</h2>";
          return;
        }
        updateUI(data.balance || 0);
        if(data.wallet) {
          const display = document.getElementById('walletDisplay');
          display.style.display = 'block';
          display.innerText = "Connected: " + data.wallet.substring(0, 6) + '...' + data.wallet.substring(data.wallet.length - 4);
        }
      }
    });
  }

  // ==========================================
  // ৫. UI আপডেট
  // ==========================================
  function updateUI(balance) {
    currentBalance = balance;
    const levelData = getLevelData(balance);
    
    document.getElementById('headerBalance').innerText = balance.toFixed(3) + " RET";
    document.getElementById('levelText').innerText = levelData.level;
    document.getElementById('rateText').innerText = levelData.rate.toFixed(2);
    
    // প্রোগ্রেস বার ক্যালকুলেশন
    let prevTarget = 0;
    if(levelData.level === 2) prevTarget = 10;
    else if(levelData.level === 3) prevTarget = 50;
    else if(levelData.level === 4) prevTarget = 200;
    else if(levelData.level > 4) prevTarget = 500 + ((levelData.level - 5) * 500);

    const progress = ((balance - prevTarget) / (levelData.nextTarget - prevTarget)) * 100;
    document.getElementById('progressBar').style.width = Math.max(0, Math.min(100, progress)) + "%";
    document.getElementById('neededText').innerText = Math.max(0, (levelData.nextTarget - balance)).toFixed(2);
  }

  // ==========================================
  // ৬. ক্লেইম ফাংশন
  // ==========================================
  function claimCoins() {
    const levelData = getLevelData(currentBalance);
    const reward = levelData.rate; 
    const newBalance = currentBalance + reward;
    
    db.ref('users/' + userId).update({
      balance: newBalance,
      lastClaim: Date.now()
    }).then(() => {
      showToast(`সফলভাবে ${reward.toFixed(3)} RET ক্লেইম হয়েছে!`);
      tg.sendData(JSON.stringify({ action: "claim", amount: reward }));
    }).catch((err) => {
      showToast("এরর: " + err.message, true);
    });
  }

  // ==========================================
  // ৭. উইথড্র রিকোয়েস্ট
  // ==========================================
  function requestWithdraw() {
    if (!walletAddress) return showToast("আগে ওয়ালেট কানেক্ট করুন!", true);
    if (currentBalance < 100) return showToast("সর্বনিম্ন ১০০ RET থাকতে হবে!", true);

    const amount = prompt(`আপনার ব্যালেন্স: ${currentBalance.toFixed(2)} RET\nকত RET উইথড্র করতে চান?`);
    if (!amount || isNaN(amount) || amount <= 0 || amount > currentBalance) {
      return showToast("সঠিক পরিমাণ লিখুন!", true);
    }

    db.ref('withdrawals').push({
      userId: userId,
      userName: userName,
      amount: parseFloat(amount),
      wallet: walletAddress,
      status: "pending",
      timestamp: Date.now()
    }).then(() => {
      db.ref('users/' + userId).update({
        balance: currentBalance - parseFloat(amount)
      }).then(() => {
        showToast("উইথড্র রিকোয়েস্ট সফল! অ্যাডমিন চেক করবেন।");
        tg.sendData(JSON.stringify({ action: "withdraw", amount: parseFloat(amount), wallet: walletAddress }));
      });
    });
  }

  // টোস্ট মেসেজ
  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.className = isError ? 'toast error show' : 'toast show';
    setTimeout(() => t.classList.remove('show'), 3000);
  }
</script>

</body>
</html>
